  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#080b12" />
  <title>Home Tracker · 237 El Bosque</title>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080b12; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { display: none; }
    .tab-btn  { cursor: pointer; background: none; border: none; font-family: inherit; }
    .done-btn { cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; }
    .done-btn:active { transform: scale(0.9); }
    .mode-btn { cursor: pointer; border: none; font-family: inherit; transition: all 0.15s; }
    .mode-btn:active { transform: scale(0.95); }
    .card { transition: all 0.25s; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ── DATES ─────────────────────────────────────────────────────────────────
    const HOME = new Date(2026, 4, 22); // May 22 — closing
    const WD   = new Date(2026, 5, 26); // Jun 26 — washer/dryer

    const addDays  = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const toKey    = (d) => d.toISOString().slice(0, 10);
    const diffDays = (a, b) => Math.round((b - a) / 86400000);

    function snapOff(date, fri = false) {
      const d = new Date(date); d.setHours(0,0,0,0);
      for (let i = 0; i < 7; i++) {
        const c = addDays(d, i);
        const w = c.getDay();
        if (fri ? w === 5 : w >= 4) return c;
      }
      return d;
    }

    function fmtDate(d) {
      return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
    }

    function fmtRel(d, today) {
      const n = diffDays(today, d);
      if (n < -1)  return `${Math.abs(n)}d overdue`;
      if (n === -1) return "Overdue";
      if (n === 0)  return "Due today";
      if (n === 1)  return "Tomorrow";
      if (n <= 6)   return `In ${n} days`;
      if (n <= 13)  return "Next week";
      if (n <= 60)  return `In ${n} days`;
      return `In ${Math.ceil(n/30)}mo`;
    }

    // ── CATEGORIES ────────────────────────────────────────────────────────────

      Structure:"#fbbf24", Plumbing:"#38bdf8", Safety:"#fb7185",
      Finance:"#4ade80",   Interior:"#e879f9", Warranty:"#f97316",
    };

    const T = [

      {id:"m3",  name:"Clean dishwasher filter — Samsung DW80CG5451SR",      freq:30,  off:30,  s:HOME, cat:"Appliance", r:'B', buy:0,  ef:1},

      // EVERY 4 MONTHS

      {id:"ba1", name:"Carrier furnace professional service",                freq:182, off:182, s:HOME, cat:"HVAC",      r:'A', buy:14, bn:"Schedule HVAC tech",       ef:3},
      {id:"ba2", name:"Mini-split AC professional service",                  freq:182, off:182, s:HOME, cat:"HVAC",      r:'A', buy:14, bn:"Schedule AC tech",         ef:3},

      {id:"ba4", name:"Re-caulk roof penetrations, vents & seams",          freq:182, off:182, s:HOME, cat:"Structure", r:'B', buy:7,  bn:"Buy roof caulk/sealant",   ef:3},
      {id:"ba5", name:"Deep clean range hood & ductwork — NSG6DG8300SRAA",  freq:182, off:182, s:HOME, cat:"Appliance", r:'B', buy:0,  ef:2},
      {id:"ba6", name:"Clean dryer vent — GE GTD48GASWWB (fire risk)",      freq:182, off:0,   s:WD,   cat:"Appliance", r:'B', buy:0,  ef:2},
      {id:"ba7", name:"Vacuum inside dryer cabinet (lint buildup)",          freq:182, off:30,  s:WD,   cat:"Appliance", r:'B', buy:0,  ef:1},
      {id:"ba8", name:"Clean bathroom exhaust fans",                         freq:182, off:182, s:HOME, cat:"Structure", r:'B', buy:0,  ef:1},

      {id:"a1",  name:"Check home leveling — doors sticking? Soft LVP?",    freq:365, off:365, s:HOME, cat:"Structure", r:'A', buy:0,  ef:2},

      {id:"a11", name:"Deep clean mini-split indoor unit — vanes & housing", freq:365, off:365, s:HOME, cat:"HVAC",      r:'B', buy:0,  ef:2},
      {id:"a12", name:"Test Rheem water heater pressure relief valve",       freq:365, off:365, s:HOME, cat:"Plumbing",  r:'A', buy:0,  ef:1},

      {id:"wa2", name:"Clean washer water inlet screens — GTW485ASWWB",      freq:365, off:335, s:WD,   cat:"Appliance", r:'B', buy:0,  ef:2},
      {id:"da1", name:"Check dryer gas connection — no smell/damage",        freq:365, off:335, s:WD,   cat:"Safety",    r:'A', buy:0,  ef:1},
      {id:"da2", name:"Inspect dryer exhaust vent exterior flap",            freq:365, off:335, s:WD,   cat:"Structure", r:'A', buy:0,  ef:1},
      // 2 YEARS
      {id:"2y1", name:"Inspect/replace Rheem anode rod (first ~Nov 2027)",   freq:730, off:548, s:HOME, cat:"Plumbing",  r:'B', buy:14, bn:"Buy anode rod or schedule plumber", ef:2},
      {id:"2y2", name:"Professional re-leveling inspection",                 freq:730, off:730, s:HOME, cat:"Structure", r:'A', buy:14, bn:"Schedule leveling pro",    ef:3},
      {id:"2y3", name:"Roof recoat evaluation",                              freq:730, off:730, s:HOME, cat:"Structure", r:'A', buy:0,  ef:3},
      {id:"2y4", name:"Full Hardiboard siding re-inspection & touch-up",     freq:730, off:730, s:HOME, cat:"Structure", r:'A', buy:7,  bn:"Buy touch-up paint",       ef:3},
      {id:"2y5", name:"Review LVP floor — lifting edges or seam gaps",       freq:730, off:730, s:HOME, cat:"Interior",  r:'A', buy:0,  ef:2},
      {id:"2y6", name:"Mini-split refrigerant check — UXC24-36MSK3IH",       freq:730, off:730, s:HOME, cat:"HVAC",      r:'A', buy:14, bn:"Schedule AC pro",          ef:3},
    ];

    // ── TASK CARD ─────────────────────────────────────────────────────────────
    function TaskCard({ task, date, today, flash, onDone, suggestion }) {
      const daysAway  = diffDays(today, date);
      const isOverdue = daysAway < 0;
      const isToday   = daysAway === 0;
      const isDone    = flash === task.id;
      const catColor  = CAT[task.cat] || "#94a3b8";
      const buyBy     = task.buy > 0 ? addDays(date, -task.buy) : null;
      const showBuy   = task.buy > 0 && daysAway >= 0 && daysAway <= task.buy + 7;

      const borderLeft = isDone ? "#22c55e" : isOverdue ? "#ef4444" : isToday ? "#3b82f6" : suggestion ? "#334155" : catColor;
      const bg = isDone ? "#0d2010" : isOverdue ? "#1a0a0a" : isToday ? "#0c1423" : "#0f1218";

      return (
        <div className="card" style={{
          background: bg,
          border: `1px solid ${isDone?"#1a4a1a":isOverdue?"#3a0a0a":isToday?"#1e3a5f":"#1a2232"}`,
          borderLeft: `3px solid ${borderLeft}`,
          borderRadius: 10, padding: "12px 12px 12px 14px",
          marginBottom: 8, opacity: suggestion ? 0.75 : 1,
        }}>
          <div style={{display:"flex", alignItems:"flex-start", gap:10}}>
            <div style={{flex:1, minWidth:0}}>
              <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:5, flexWrap:"wrap"}}>
                <span style={{
                  fontSize:8, fontWeight:700, letterSpacing:1.5, textTransform:"uppercase",
                  color:catColor, background:`${catColor}18`, padding:"2px 6px", borderRadius:3, whiteSpace:"nowrap",
                }}>{task.cat}</span>
                <span style={{
                  fontSize:10, fontWeight:(isOverdue||isToday)?600:400,
                  color:isDone?"#4ade80":isOverdue?"#f87171":isToday?"#60a5fa":"#64748b",
                }}>{isDone ? "✓ Done!" : fmtRel(date, today)}</span>
                {!isDone && <span style={{fontSize:10, color:"#2d3a4a"}}>· {fmtDate(date)}</span>}
                {task.r==='B' && !isDone && (
                  <span style={{fontSize:8, color:"#1e3a5f", letterSpacing:1, textTransform:"uppercase"}}>resets</span>
                )}
              </div>
              <div style={{
                fontSize:13, color:isDone?"#4ade8080":"#cbd5e1",
                lineHeight:1.45, marginBottom:showBuy?7:0,
                textDecoration:isDone?"line-through":"none",
              }}>{task.name}</div>
              {showBuy && !isDone && task.bn && (
                <div style={{
                  display:"inline-flex", alignItems:"center", gap:6, fontSize:10, color:"#fbbf24",
                  background:"#451a0318", border:"1px solid #451a0360",
                  borderRadius:5, padding:"4px 9px", marginTop:2,
                }}>
                  🛒 {task.bn}
                  {buyBy && diffDays(today, buyBy) > 0 && <span style={{color:"#78716c"}}>— by {fmtDate(buyBy)}</span>}
                  {buyBy && diffDays(today, buyBy) <= 0 && <span style={{color:"#f87171", fontWeight:600}}>— buy now</span>}
                </div>
              )}
            </div>
            {!isDone && (
              <button className="done-btn" onClick={() => onDone(task, date)} style={{
                width:40, height:40, borderRadius:20, flexShrink:0,
                background:isToday?"#1e3a5f":"#0d1117",
                border:`1.5px solid ${isToday?"#3b82f6":"#1e293b"}`,
                color:isToday?"#60a5fa":"#334155",
                fontSize:18, display:"flex", alignItems:"center", justifyContent:"center",
              }}>○</button>
            )}
          </div>
        </div>
      );
    }

    // ── APP ───────────────────────────────────────────────────────────────────
    function App() {
      const today = useMemo(() => { const d = new Date(); d.setHours(0,0,0,0); return d; }, []);
      const [comps,   setComps]   = useState({});
      const [tab,     setTab]     = useState("week");
      const [dayMode, setDayMode] = useState(null);
      const [flash,   setFlash]   = useState(null);
      const [loaded,  setLoaded]  = useState(false);

      useEffect(() => {
        try {
          const saved = localStorage.getItem("ht-v6");
          if (saved) setComps(JSON.parse(saved));
        } catch {}
        setLoaded(true);
      }, []);

      const nextDue = useCallback((task) => {
        if (task.r === 'B') {
          const last = comps[`${task.id}-last`];
          const base = last ? new Date(last) : addDays(task.s, task.off);
          const raw  = last ? addDays(new Date(last), task.freq) : base;
          return snapOff(raw, task.fri);
        }
        let raw = addDays(task.s, task.off);
        for (let i = 0; i < 300; i++) {
          const sched = snapOff(raw, task.fri);
          if (!comps[`${task.id}-${toKey(sched)}`]) return sched;
          raw = addDays(raw, task.freq);
        }
        return null;
      }, [comps]);

      const markDone = useCallback((task, dueDate) => {
        setFlash(task.id);
        setTimeout(() => setFlash(null), 700);
        const next = { ...comps };
        if (task.r === 'B') {
          next[`${task.id}-last`] = toKey(today);
        } else {
          next[`${task.id}-${toKey(dueDate)}`] = true;
        }
        setComps(next);
        try { localStorage.setItem("ht-v6", JSON.stringify(next)); } catch {}
      }, [comps, today]);

      const allDues = useMemo(() =>
        T.map(t => ({ t, date: nextDue(t) }))
         .filter(x => x.date)
         .sort((a, b) => a.date - b.date),
      [nextDue]);

      const overdueCount = useMemo(() =>
        allDues.filter(x => diffDays(today, x.date) < 0).length,
      [allDues, today]);

      const tabItems = useMemo(() => {
        const d = x => diffDays(today, x.date);
        if (tab==="today") return allDues.filter(x => d(x) <= 0);
        if (tab==="week")  return allDues.filter(x => d(x) >= 0 && d(x) <= 7);
        if (tab==="month") return allDues.filter(x => d(x) >= 0 && d(x) <= 30);
        if (tab==="buy")   return allDues.filter(x => x.t.buy > 0 && d(x) >= 0 && d(x) <= x.t.buy + 7);
        return [];
      }, [allDues, tab, today]);

      const suggestions = useMemo(() => {
        if (!dayMode) return [];
        const maxEf = dayMode === 'early' ? 2 : 3;
        const shown = new Set(tabItems.map(x => x.t.id));
        return allDues
          .filter(x => !shown.has(x.t.id) && x.t.ef <= maxEf && diffDays(today, x.date) >= 0 && diffDays(today, x.date) <= 60)
          .slice(0, 6);
      }, [dayMode, allDues, tabItems, today]);

      const counts = useMemo(() => {
        const d = x => diffDays(today, x.date);
        return {
          today: allDues.filter(x => d(x) <= 0).length,
          week:  allDues.filter(x => d(x) >= 0 && d(x) <= 7).length,
          month: allDues.filter(x => d(x) >= 0 && d(x) <= 30).length,
          buy:   allDues.filter(x => x.t.buy > 0 && d(x) >= 0 && d(x) <= x.t.buy + 7).length,
        };
      }, [allDues, today]);

      if (!loaded) return (
        <div style={{background:"#080b12",height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#1e293b",fontFamily:"monospace",letterSpacing:4,fontSize:11}}>
          LOADING...
        </div>
      );

      const TABS = [
        {id:"today", label:"Today",     count:counts.today},
        {id:"week",  label:"This Week", count:counts.week},
        {id:"month", label:"Next 30",   count:counts.month},
        {id:"buy",   label:"🛒 Buy",    count:counts.buy},
      ];

      return (
        <div style={{background:"#080b12", minHeight:"100vh", color:"#e2e8f0", paddingBottom:40}}>
          {/* HEADER */}
          <div style={{background:"#0d111a", borderBottom:"1px solid #1a2232", padding:"14px 16px 0", position:"sticky", top:0, zIndex:20}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10}}>
              <div>
                <div style={{fontSize:9, color:"#334155", letterSpacing:3, textTransform:"uppercase", marginBottom:3}}>
                  237 El Bosque St · San Jose, CA
                </div>
                <div style={{fontSize:19, fontWeight:700, letterSpacing:-0.5, lineHeight:1}}>
                  Home Tracker
                </div>
                <div style={{fontSize:10, color:"#1e3a5f", marginTop:3}}>
                  {today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
                  {overdueCount > 0 && (
                    <span style={{color:"#ef4444", marginLeft:8, fontWeight:600}}>· {overdueCount} overdue</span>
                  )}
                </div>
              </div>
              <div style={{display:"flex", flexDirection:"column", gap:5, alignItems:"flex-end"}}>
                <div style={{fontSize:8, color:"#334155", letterSpacing:2, textTransform:"uppercase"}}>Today I'm</div>
                <div style={{display:"flex", gap:5}}>
                  {[{id:"early",label:"Off Early"},{id:"off",label:"Full Day Off"}].map(m => (
                    <button key={m.id} className="mode-btn"
                      onClick={() => setDayMode(prev => prev===m.id ? null : m.id)}
                      style={{
                        fontSize:9, fontWeight:600, letterSpacing:0.5, padding:"4px 8px",
                        borderRadius:20, border:"1px solid",
                        borderColor:  dayMode===m.id ? "#3b82f6" : "#1e293b",
                        color:        dayMode===m.id ? "#93c5fd"  : "#475569",
                        background:   dayMode===m.id ? "#1e3a5f20": "transparent",
                      }}>{m.label}</button>
                  ))}
                </div>
              </div>
            </div>
            {/* TABS */}
            <div style={{display:"flex"}}>
              {TABS.map(tb => (
                <button key={tb.id} className="tab-btn" onClick={() => setTab(tb.id)} style={{
                  padding:"8px 10px", fontSize:11, fontWeight:600, letterSpacing:0.3,
                  color:       tab===tb.id ? "#e2e8f0" : "#475569",
                  borderBottom:`2px solid ${tab===tb.id ? "#3b82f6" : "transparent"}`,
                  display:"flex", alignItems:"center", gap:4,
                }}>
                  {tb.label}
                  {tb.count > 0 && (
                    <span style={{
                      fontSize:9, fontWeight:700, padding:"1px 5px", borderRadius:10,
                      background: tb.id==="buy" ? "#92400e" : tab===tb.id ? "#1e3a5f" : "#141b27",
                      color:      tb.id==="buy" ? "#fbbf24" : tab===tb.id ? "#93c5fd" : "#475569",
                    }}>{tb.count}</span>
                  )}
                </button>
              ))}
            </div>
          </div>

          {/* CONTENT */}
          <div style={{padding:"10px 14px", maxWidth:640, margin:"0 auto"}}>
            {tab==="buy" && tabItems.length > 0 && (
              <div style={{fontSize:10, color:"#64748b", letterSpacing:1, textTransform:"uppercase", padding:"4px 0 10px"}}>
                Purchase before the task date
              </div>
            )}

            {tabItems.length === 0 && (
              <div style={{textAlign:"center", padding:"48px 0 24px"}}>
                <div style={{fontSize:36, marginBottom:10}}>✓</div>
                <div style={{fontSize:13, color:"#334155", letterSpacing:0.5}}>
                  {tab==="today" ? "Nothing due today" :
                   tab==="week"  ? "All clear this week" :
                   tab==="buy"   ? "Nothing to buy right now" :
                                   "Nothing in the next 30 days"}
                </div>
                {tab==="today" && allDues.length > 0 && (
                  <div style={{marginTop:14, fontSize:11, color:"#1e3a5f"}}>
                    Next up — {allDues[0].t.name}<br/>
                    <span style={{color:"#334155"}}>{fmtDate(allDues[0].date)}</span>
                  </div>
                )}
              </div>
            )}

            {tabItems.map(({t,date}) => (
              <TaskCard key={t.id} task={t} date={date} today={today} flash={flash} onDone={markDone} suggestion={false} />
            ))}

            {dayMode && suggestions.length > 0 && (
              <div style={{marginTop:20}}>
                <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:10}}>
                  <div style={{flex:1, height:1, background:"#1a2232"}} />
                  <div style={{fontSize:9, color:"#334155", letterSpacing:3, textTransform:"uppercase", whiteSpace:"nowrap"}}>
                    {dayMode==='early' ? '⚡ Off Early — get ahead' : '🗓 Full Day — bonus tasks'}
                  </div>
                  <div style={{flex:1, height:1, background:"#1a2232"}} />
                </div>
                {suggestions.map(({t,date}) => (
                  <TaskCard key={`sug-${t.id}`} task={t} date={date} today={today} flash={flash} onDone={markDone} suggestion={true} />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
